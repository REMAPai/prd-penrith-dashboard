name: pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: [staging, production]
  push:
    branches: [staging, production]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7
      - run: npm run build

  # Slow (about 5 to 8 minutes). Off the staging path by choice: runs on pull requests and pushes to production,
  # and on demand (Actions tab, Run workflow). ci covers lint, types, unit and regression tests and the build.
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'production' || github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/prd_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Dokploy and wait for the build
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APPLICATION_ID: ${{ vars.DOKPLOY_STAGING_APP_ID }}
        run: bash scripts/ci/dokploy-deploy.sh
      - name: Wait for the site to answer
        env:
          SITE_URL: ${{ vars.STAGING_URL }}
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/login" || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "Site did not become healthy in 10 minutes" && exit 1

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/production' && vars.DOKPLOY_PRODUCTION_APP_ID != ''
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Dokploy and wait for the build
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APPLICATION_ID: ${{ vars.DOKPLOY_PRODUCTION_APP_ID }}
        run: bash scripts/ci/dokploy-deploy.sh
